[MODULE_PARAMETERS]
# --- PIXIT Parameters (overridable at runtime) ---
PIXIT_SECC_CMN_SUT_IP_Address := "ff02::01"
PIXIT_SECC_CMN_Message_Timeout := 2.0
PIXIT_SECC_CMN_Combined_Testing_Mode := false

[LOGGING]
# Log file location (relative to build/ dir)
LogFile := "../logs/titan_traces/TC_SECC_CMN_VTB_SupportedAppProtocol_001_%r.log"
AppendFile := false
TimeStampFormat := DateTime
LogEntityName := Yes
LogEventTypes := Yes
# FileMask: capture all options for Fault Agent analysis
FileMask := LOG_ALL | TTCN_WARNING | TTCN_ERROR | TTCN_DEBUG
ConsoleMask := TTCN_WARNING | TTCN_ERROR | TTCN_TESTCASE | TTCN_VERDICT
LogSourceInfo := Stack
LogOptions := Yes

[TESTPORT_PARAMETERS]
# --- TCP/TLS Port (SECC, SIL mode) ---
*.pt_V2G_TCP_TLS_ALM_SECC_Port.sut_mode := "SIL"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.sut_ip := "ff02::01"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.sut_port := "15118"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.use_tls := "true"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.tls_cert := "certs/secc_cert.pem"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.tls_key := "certs/secc_key.pem"
*.pt_V2G_TCP_TLS_ALM_SECC_Port.tls_ca := "certs/v2g_ca.pem"
# --- UDP/SDP Port ---
*.pt_V2G_UDP_SDP_Port.sdp_multicast_addr := "ff02::01"
*.pt_V2G_UDP_SDP_Port.sdp_port := "15118"
*.pt_V2G_UDP_SDP_Port.sut_mode := "SIL"

[EXECUTE]
# Testcase to execute
TC_SECC_CMN_VTB_SupportedAppProtocol_001.TC_SECC_CMN_VTB_SupportedAppProtocol_001

[MAIN_CONTROLLER]
# Overall test campaign timeout: timer_value_ms * 2 / 1000.0 = 4.0 s
tc_timeout := 4.0
LocalAddress := localhost
TCPPort := 9000
NumHCs := 1
KillTimer := 10.0
